<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- ===================================================================
       DOSBTS app icon — the eiDotter yolk restated as a Libre-style CGM sensor.
       Mirrors the `any` variant of scripts/render-app-icon.py (the rasterizer,
       which also emits the dark + tinted variants). Keep the two in sync.

       Geometry is proportional to the body radius R = 300 (disc ≈ 59% of the
       frame, inside Apple's icon grid):
         body       circle r=R at centre, radial DOME → AMBER → AMBER_DARK
         edge ring  0.03R, #9A5700
         oval       rx=0.50R ry=0.21R, centred 0.45R above centre — recessed
                    well with a shadowed top edge and a lit bottom lip
         hole       r=0.11R at the disc centre, 0.035R #9A5700 ring

       Palette hexes match eiDotter brand tokens verbatim.
       ===================================================================
  -->
  <defs>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <radialGradient id="bodyFill" cx="39%" cy="36%" r="62%">
      <stop offset="0%"   stop-color="#FFD97A"/>
      <stop offset="50%"  stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#9A5700"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="512" cy="512" r="300"/></clipPath>
    <clipPath id="well"><ellipse cx="512" cy="377" rx="150" ry="63"/></clipPath>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,0,0,0.08)"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" fill="#000000"/>

  <!-- Phosphor bloom -->
  <circle cx="512" cy="512" r="300" fill="#FFB000" opacity="0.43" filter="url(#bloom)"/>

  <!-- Sensor body + edge ring -->
  <circle cx="512" cy="512" r="300" fill="url(#bodyFill)"/>
  <circle cx="512" cy="512" r="295.5" fill="none" stroke="#9A5700" stroke-width="9"/>

  <!-- Oval cutout: lit lip (lowered copy), well floor, shadowed top edge -->
  <ellipse cx="512" cy="390.5" rx="150" ry="63" fill="#FFE8A8"/>
  <ellipse cx="512" cy="377"   rx="150" ry="63" fill="#9A5700"/>
  <g clip-path="url(#well)">
    <path fill="#603400" fill-rule="evenodd"
          d="M362,300 H662 V460 H362 Z M362,390.5 a150,63 0 1,0 300,0 a150,63 0 1,0 -300,0 Z"/>
  </g>

  <!-- Filament hole -->
  <circle cx="512" cy="512" r="43.5" fill="#9A5700"/>
  <circle cx="512" cy="512" r="33"   fill="#000000"/>

  <!-- Scanlines, clipped to the disc -->
  <rect width="1024" height="1024" fill="url(#scanlines)" clip-path="url(#disc)"/>
</svg>
